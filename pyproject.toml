[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickrun-mcp"
version = "1.1.0"
description = "QuickRun: Python & shell code-execution MCP server for AWS Quick (and any MCP client)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "aws-quick", "code-execution", "sandbox", "python", "shell"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
# Install with: uvx --from git+https://github.com/liangyimingcom/quickrun-mcp "quickrun-mcp[data]"
data = [
    "pandas>=1.5",
    "numpy>=1.23",
    "openpyxl>=3.0",
    "xlsxwriter>=3.0",
    "python-docx>=0.8",
    "python-pptx>=0.6",
    "pypdf>=3.0",
    "pdfplumber>=0.7",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "plotly>=5.0",
    "kaleido>=0.2",
    "reportlab>=3.6",
    "Pillow>=9.0",
    "lxml>=4.9",
    "defusedxml>=0.7",
    "markdown>=3.4",
    "mammoth>=1.4",
    "imageio>=2.19",
    "duckdb>=0.7",
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/liangyimingcom/quickrun-mcp"
Repository = "https://github.com/liangyimingcom/quickrun-mcp"
Issues = "https://github.com/liangyimingcom/quickrun-mcp/issues"

[project.scripts]
quickrun-mcp = "quickrun_mcp.server:main"
# Compatibility alias for users migrating from quick-code-exec-mcp
quick-code-exec-mcp = "quickrun_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quickrun_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
